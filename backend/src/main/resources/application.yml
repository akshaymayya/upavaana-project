spring:
  application:
    name: plant-doctor-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/plant_doctor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    enabled: ${SEED_ON_STARTUP:false}
    csv-path: ${SEED_CSV_PATH:./plant-disease-seed-template.csv}
