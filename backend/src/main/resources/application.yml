spring:
  application:
    name: plant-doctor-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/plant_doctor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    enabled: ${SEED_ON_STARTUP:false}
    csv-path: ${SEED_CSV_PATH:./plant-disease-seed-template.csv}

nvidia:
  api-key: ${NVIDIA_API_KEY:}
  base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
  vision-model: ${NVIDIA_VISION_MODEL:meta/llama-3.2-11b-vision-instruct}
  text-model: ${NVIDIA_TEXT_MODEL:meta/llama-3.1-8b-instruct}
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-v4-pro}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: gpt-4o

